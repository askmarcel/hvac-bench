name: am-harness

on:
  push:
    paths:
      - 'am/**'
      - 'taxonomy/**'
      - '.github/workflows/am-harness.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'am/**'
      - 'taxonomy/**'
      - '.github/workflows/am-harness.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Exécuter le dry-run E2E (nécessite tous les secrets AM_*)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_dev:
        description: 'Exécuter itération dev T11 (10 cas × 3 bras × 3 réplicats)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_arms:
        description: 'Bras T11 (ex: L0,LW,PROD ou LW,PROD pour reprendre sans L0)'
        required: false
        default: 'LW,PROD'
        type: string
      prior_run_id:
        description: 'Run ID CI précédent — récupère score L0 pour le rapport (optionnel)'
        required: false
        default: ''
        type: string
      run_gate:
        description: 'Exécuter run gate complet T12 (budget ~900 appels LLM)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_retry_blocked:
        description: 'Relancer les réplicats blocked du prior_run_id (score.json)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_smoke_parseur:
        description: 'Smoke harnais CORE — ham-0016 × 3 × LW+PROD (runHarnaisTurn in-process)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_full_t11:
        description: 'AUTORISER T11 complet (90 dialogues) — désactivé par défaut, coût élevé'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_capture_stream:
        description: 'T14 — capturer flux HTTP surface (S2 mobile par défaut), pas le gate harnais'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  mechanical:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Valider les cas AM
        run: pnpm am:validate-cases
      - name: Scorer mécanique (fixtures)
        run: pnpm am:check-scorer
      - name: Checkout WebApp (surfaces C1–C6)
        uses: actions/checkout@v4
        with:
          repository: askmarcel/AskMarcel-WebApp-NextJS
          token: ${{ secrets.WEBAPP_REPO_TOKEN }}
          path: AskMarcel-WebApp-NextJS
        continue-on-error: true
      - name: Conformité surfaces (C1–C6)
        if: hashFiles('AskMarcel-WebApp-NextJS/package.json') != ''
        working-directory: AskMarcel-WebApp-NextJS
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec tsx scripts/check-surfaces-conformity.ts
      - name: Tests surfaces D/F/G (sans LLM)
        if: hashFiles('AskMarcel-WebApp-NextJS/package.json') != ''
        run: pnpm exec tsx am/scripts/run-surface-tests.ts --group DFG

  llm-checks:
    runs-on: ubuntu-latest
    needs: mechanical
    if: github.event_name != 'pull_request'
    env:
      AM_SIM_MODEL: ${{ secrets.AM_SIM_MODEL }}
      AM_SIM_API_KEY: ${{ secrets.AM_SIM_API_KEY }}
      AM_JUDGE_MODEL: ${{ secrets.AM_JUDGE_MODEL }}
      AM_JUDGE_API_KEY: ${{ secrets.AM_JUDGE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Vérifier secrets simulateur
        run: |
          if [ -z "$AM_SIM_MODEL" ]; then
            echo "::error::AM_SIM_MODEL requis pour am:check-sim"
            exit 1
          fi
          if [ -z "$AM_SIM_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::AM_SIM_API_KEY ou OPENROUTER_API_KEY requis"
            exit 1
          fi
      - name: Simulateur installateur (5/5)
        run: pnpm am:check-sim
      - name: Vérifier secrets juge
        run: |
          if [ -z "$AM_JUDGE_MODEL" ]; then
            echo "::error::AM_JUDGE_MODEL requis (modèle distinct du simulateur)"
            exit 1
          fi
      - name: Juge (6/6 + variance)
        run: pnpm am:check-judge

  e2e-dry-run:
    runs-on: ubuntu-latest
    needs: llm-checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_e2e == 'true'
    env:
      AM_HARNESS_MODEL_ID: ${{ secrets.AM_HARNESS_MODEL_ID }}
      AM_SIM_MODEL: ${{ secrets.AM_SIM_MODEL }}
      AM_SIM_API_KEY: ${{ secrets.AM_SIM_API_KEY }}
      AM_JUDGE_MODEL: ${{ secrets.AM_JUDGE_MODEL }}
      AM_JUDGE_API_KEY: ${{ secrets.AM_JUDGE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AM_HARNESS_SURFACE: CORE
      WEBAPP_REPO_PATH: ${{ github.workspace }}/hvac-bench/AskMarcel-WebApp-NextJS
    steps:
      - uses: actions/checkout@v4
        with:
          path: hvac-bench
      - uses: actions/checkout@v4
        with:
          repository: askmarcel/AskMarcel-WebApp-NextJS
          token: ${{ secrets.WEBAPP_REPO_TOKEN }}
          path: hvac-bench/AskMarcel-WebApp-NextJS
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bench
        working-directory: hvac-bench
        run: pnpm install --no-frozen-lockfile
      - name: WebApp env (harnais in-process)
        working-directory: hvac-bench
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AM_HARNESS_SUPABASE_SERVICE_ROLE_KEY }}
        run: bash am/scripts/setup-webapp-bench-env.sh AskMarcel-WebApp-NextJS
      - name: Install WebApp
        working-directory: hvac-bench/AskMarcel-WebApp-NextJS
        run: pnpm install --no-frozen-lockfile
      - name: Dry-run T10 (2 cas × 3 bras, CORE)
        working-directory: hvac-bench
        run: pnpm am:dry-run
      - name: Archiver rapport dry-run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-dry-run-report
          path: hvac-bench/am/reports/dry-run-*.md
          retention-days: 90

  dev-run:
    runs-on: ubuntu-latest
    needs: llm-checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_dev == 'true'
    env:
      AM_HARNESS_MODEL_ID: ${{ secrets.AM_HARNESS_MODEL_ID }}
      AM_SIM_MODEL: ${{ secrets.AM_SIM_MODEL }}
      AM_SIM_API_KEY: ${{ secrets.AM_SIM_API_KEY }}
      AM_JUDGE_MODEL: ${{ secrets.AM_JUDGE_MODEL }}
      AM_JUDGE_API_KEY: ${{ secrets.AM_JUDGE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AM_HARNESS_SURFACE: CORE
      WEBAPP_REPO_PATH: ${{ github.workspace }}/AskMarcel-WebApp-NextJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: askmarcel/AskMarcel-WebApp-NextJS
          token: ${{ secrets.WEBAPP_REPO_TOKEN }}
          path: AskMarcel-WebApp-NextJS
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Garde T11 complet (désactivé par défaut)
        run: |
          if [ "${{ github.event.inputs.force_full_t11 }}" != "true" ]; then
            echo "::error::T11 complet désactivé (coût ~90 dialogues). Valider G0 via run_smoke_parseur=true d'abord, puis force_full_t11=true."
            exit 1
          fi
      - name: WebApp env (harnais in-process)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AM_HARNESS_SUPABASE_SERVICE_ROLE_KEY }}
        run: bash am/scripts/setup-webapp-bench-env.sh AskMarcel-WebApp-NextJS
      - name: Install WebApp
        working-directory: AskMarcel-WebApp-NextJS
        run: pnpm install --no-frozen-lockfile
      - name: Récupérer scores L0 du run précédent
        if: >-
          github.event.inputs.prior_run_id != '' &&
          contains(github.event.inputs.run_arms, 'L0') == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.event.inputs.prior_run_id }}" \
            -R "${{ github.repository }}" \
            -n am-dev-report \
            -D prior-report
          L0_SCORE=$(find prior-report -path '*am-l0*/score.json' | head -1)
          if [ -z "$L0_SCORE" ]; then
            echo "::error::score L0 introuvable dans l'artifact du run ${{ github.event.inputs.prior_run_id }}"
            exit 1
          fi
          echo "L0_SCORE=$L0_SCORE" >> "$GITHUB_ENV"
          echo "✅ Score L0 récupéré : $L0_SCORE"
      - name: Smoke harnais (ham-0016 × LW × 3 réplicats, CORE)
        run: pnpm exec tsx am/runner/run-arm.ts --arm LW --split dev --surface CORE --cases ham-0016 --replicates 3
      - name: Run dev T11
        run: |
          ARGS=(--split dev --arms "${{ github.event.inputs.run_arms }}")
          if [ -n "${L0_SCORE:-}" ]; then
            ARGS+=(--include-scores "$L0_SCORE")
          fi
          pnpm am:run-iteration "${ARGS[@]}"
      - name: Archiver rapports dev
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-dev-report
          path: |
            am/reports/dev-iteration-*.md
            runs/**/score.json
            runs/**/raw.jsonl
            runs/**/manifest.json
          retention-days: 90

  smoke-parseur:
    runs-on: ubuntu-latest
    needs: llm-checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_smoke_parseur == 'true'
    env:
      AM_HARNESS_MODEL_ID: ${{ secrets.AM_HARNESS_MODEL_ID }}
      AM_SIM_MODEL: ${{ secrets.AM_SIM_MODEL }}
      AM_SIM_API_KEY: ${{ secrets.AM_SIM_API_KEY }}
      AM_JUDGE_MODEL: ${{ secrets.AM_JUDGE_MODEL }}
      AM_JUDGE_API_KEY: ${{ secrets.AM_JUDGE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AM_HARNESS_SURFACE: CORE
      WEBAPP_REPO_PATH: ${{ github.workspace }}/AskMarcel-WebApp-NextJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: askmarcel/AskMarcel-WebApp-NextJS
          token: ${{ secrets.WEBAPP_REPO_TOKEN }}
          path: AskMarcel-WebApp-NextJS
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: WebApp env (harnais in-process)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AM_HARNESS_SUPABASE_SERVICE_ROLE_KEY }}
        run: bash am/scripts/setup-webapp-bench-env.sh AskMarcel-WebApp-NextJS
      - name: Install WebApp
        working-directory: AskMarcel-WebApp-NextJS
        run: pnpm install --no-frozen-lockfile
      - name: Smoke harnais ham-0016 × 3 × LW+PROD (CORE)
        run: pnpm am:smoke-parseur
      - name: Archiver transcripts smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-smoke-parseur
          path: |
            runs/**/raw.jsonl
            runs/**/manifest.json
            runs/**/score.json
          retention-days: 90

  capture-stream:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_capture_stream == 'true'
    env:
      AM_HARNESS_URL: ${{ secrets.AM_HARNESS_URL }}
      AM_HARNESS_BEARER_TOKEN: ${{ secrets.AM_HARNESS_BEARER_TOKEN }}
      AM_HARNESS_MODEL_ID: ${{ secrets.AM_HARNESS_MODEL_ID }}
      AM_HARNESS_BENCH_EMAIL: th1b4ut.dev@gmail.com
      AM_HARNESS_TRANSPORT: http
      ALLOW_BENCH_MODE: 'true'
      AM_HARNESS_BENCH_PASSWORD: ${{ secrets.AM_HARNESS_BENCH_PASSWORD }}
      AM_HARNESS_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
      AM_HARNESS_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Régénérer JWT bench
        env:
          AM_HARNESS_BENCH_PASSWORD: ${{ secrets.AM_HARNESS_BENCH_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$AM_HARNESS_BENCH_PASSWORD" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            pnpm add @supabase/supabase-js@^2 --silent
            TOKEN=$(node --input-type=module -e "
              import { createClient } from '@supabase/supabase-js';
              const c = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY, { auth: { persistSession: false } });
              const { data, error } = await c.auth.signInWithPassword({ email: process.env.AM_HARNESS_BENCH_EMAIL, password: process.env.AM_HARNESS_BENCH_PASSWORD });
              if (error || !data.session?.access_token) { console.error(error?.message ?? 'no token'); process.exit(1); }
              process.stdout.write(data.session.access_token);
            " 2>/dev/null) || true
            if [ -n "$TOKEN" ]; then
              echo "AM_HARNESS_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            fi
          fi
      - name: Capturer ham-0016 LW + PROD
        run: |
          pnpm am:capture-stream --arm LW --case ham-0016 --out am/runner/fixtures/streams/ham-0016-lw.txt
          pnpm am:capture-stream --arm PROD --case ham-0016 --out am/runner/fixtures/streams/ham-0016-prod.txt
      - name: Archiver flux capturés
        uses: actions/upload-artifact@v4
        with:
          name: am-capture-stream
          path: am/runner/fixtures/streams/ham-0016-*.txt
          retention-days: 90

  retry-blocked:
    runs-on: ubuntu-latest
    needs: llm-checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_retry_blocked == 'true' &&
      github.event.inputs.prior_run_id != ''
    env:
      AM_HARNESS_URL: ${{ secrets.AM_HARNESS_URL }}
      AM_HARNESS_BEARER_TOKEN: ${{ secrets.AM_HARNESS_BEARER_TOKEN }}
      AM_HARNESS_MODEL_ID: ${{ secrets.AM_HARNESS_MODEL_ID }}
      AM_SIM_MODEL: ${{ secrets.AM_SIM_MODEL }}
      AM_SIM_API_KEY: ${{ secrets.AM_SIM_API_KEY }}
      AM_JUDGE_MODEL: ${{ secrets.AM_JUDGE_MODEL }}
      AM_JUDGE_API_KEY: ${{ secrets.AM_JUDGE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AM_HARNESS_BENCH_EMAIL: th1b4ut.dev@gmail.com
      AM_HARNESS_TRANSPORT: http
      ALLOW_BENCH_MODE: 'true'
      AM_HARNESS_BENCH_PASSWORD: ${{ secrets.AM_HARNESS_BENCH_PASSWORD }}
      AM_HARNESS_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
      AM_HARNESS_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: Régénérer JWT bench
        env:
          AM_HARNESS_BENCH_PASSWORD: ${{ secrets.AM_HARNESS_BENCH_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$AM_HARNESS_BENCH_PASSWORD" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            pnpm add @supabase/supabase-js@^2 --silent
            TOKEN=$(node --input-type=module -e "
              import { createClient } from '@supabase/supabase-js';
              const c = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY, { auth: { persistSession: false } });
              const { data, error } = await c.auth.signInWithPassword({ email: process.env.AM_HARNESS_BENCH_EMAIL, password: process.env.AM_HARNESS_BENCH_PASSWORD });
              if (error || !data.session?.access_token) { console.error(error?.message ?? 'no token'); process.exit(1); }
              process.stdout.write(data.session.access_token);
            " 2>/dev/null) || true
            if [ -n "$TOKEN" ]; then
              echo "AM_HARNESS_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
              echo "✅ JWT bench régénéré"
            fi
          fi
      - name: Télécharger artifact du run précédent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.event.inputs.prior_run_id }}" \
            -R "${{ github.repository }}" \
            -n am-dev-report \
            -D prior-report
      - name: Relancer réplicats blocked
        run: pnpm am:retry-blocked --artifact-dir prior-report
      - name: Archiver scores mis à jour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-retry-blocked-report
          path: |
            runs/**/score.json
            runs/**/raw.jsonl
          retention-days: 90

  gate-run:
    runs-on: ubuntu-latest
    needs: llm-checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_gate == 'true'
    env:
      AM_HARNESS_MODEL_ID: ${{ secrets.AM_HARNESS_MODEL_ID }}
      AM_SIM_MODEL: ${{ secrets.AM_SIM_MODEL }}
      AM_SIM_API_KEY: ${{ secrets.AM_SIM_API_KEY }}
      AM_JUDGE_MODEL: ${{ secrets.AM_JUDGE_MODEL }}
      AM_JUDGE_API_KEY: ${{ secrets.AM_JUDGE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AM_HARNESS_SURFACE: CORE
      WEBAPP_REPO_PATH: ${{ github.workspace }}/AskMarcel-WebApp-NextJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: askmarcel/AskMarcel-WebApp-NextJS
          token: ${{ secrets.WEBAPP_REPO_TOKEN }}
          path: AskMarcel-WebApp-NextJS
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - name: WebApp env (harnais in-process)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AM_HARNESS_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.AM_HARNESS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AM_HARNESS_SUPABASE_SERVICE_ROLE_KEY }}
        run: bash am/scripts/setup-webapp-bench-env.sh AskMarcel-WebApp-NextJS
      - name: Install WebApp
        working-directory: AskMarcel-WebApp-NextJS
        run: pnpm install --no-frozen-lockfile
      - name: Run gate T12 (3 bras × 10 cas × 3 réplicats)
        run: pnpm am:run-iteration --split gate
      - name: Archiver rapports gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am-gate-report
          path: |
            am/reports/gate-iteration-*.md
            runs/**/score.json
            runs/**/raw.jsonl
            runs/**/manifest.json
          retention-days: 90
